[package]
name = "vk-engine"
version = "1.0.1"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
fs4 = { version = "1.1.0", default-features = false }
filetime = "0.2.29"
sha2 = { version = "0.11.1", default-features = false, features = ["alloc"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
