name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version $version in src-tauri/Cargo.toml"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - run: npm run build
      - name: Build exe
        working-directory: src-tauri
        run: cargo build --release -p vk-saver --features tauri/custom-protocol
      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace
      - run: npm test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp src-tauri/target/release/vk-saver.exe THIRD-PARTY-LICENSES.txt out/
          cd out
          sha256sum vk-saver.exe > SHA256SUMS.txt
          gh release create "$TAG" --verify-tag --title "$TAG" vk-saver.exe THIRD-PARTY-LICENSES.txt SHA256SUMS.txt
