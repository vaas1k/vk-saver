name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          conf=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n 1)
          pkg=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -n 1)
          if [ "$TAG" != "v$version" ] || [ "$version" != "$conf" ] || [ "$version" != "$pkg" ]; then
            echo "version mismatch: tag=$TAG cargo=$version tauri.conf=$conf package.json=$pkg"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - name: Build exe + NSIS installer
        run: |
          npx --yes @tauri-apps/cli@2.12.6 build --features tauri/custom-protocol --bundles nsis
          cp src-tauri/target/release/bundle/nsis/*-setup.exe vk-saver-setup.exe
      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace
      - run: npm test

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/vk-saver.exe
            vk-saver-setup.exe

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.0

      - name: Sign exe (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle vk-saver.exe.bundle \
            --new-bundle-format \
            src-tauri/target/release/vk-saver.exe
          cosign sign-blob --yes \
            --bundle vk-saver-setup.exe.bundle \
            --new-bundle-format \
            vk-saver-setup.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp src-tauri/target/release/vk-saver.exe THIRD-PARTY-LICENSES.txt out/
          cp vk-saver-setup.exe vk-saver.exe.bundle vk-saver-setup.exe.bundle out/
          cd out
          sha256sum vk-saver.exe vk-saver-setup.exe > SHA256SUMS.txt
          gh release create "$TAG" --verify-tag --title "$TAG" vk-saver.exe vk-saver-setup.exe THIRD-PARTY-LICENSES.txt SHA256SUMS.txt vk-saver.exe.bundle vk-saver-setup.exe.bundle
