name: fuzz

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 3 * * 0"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/engine/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - name: Install Rust build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz regression
        run: |
          cd src-tauri/engine/fuzz
          cargo fuzz run fuzz_unzip -- -max_total_time=90
          cargo fuzz run fuzz_search -- -max_total_time=90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-artifacts
          path: src-tauri/engine/fuzz/artifacts
          if-no-files-found: ignore
